name: rakaia
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: rakaia test on ${{ matrix.os }} with ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get -y update && sudo apt-get install -y libgl1-mesa-dev libvips-dev build-essential cmake
      - name: Install libvips if using Windows
        if: runner.os == 'Windows'
        run: choco install vips -y
      - name: Install libvips uf using macOS
        if: runner.os == 'macOS'
        run: brew install vips
      - name: Install rakaia through pip after dependencies
        run: pip install -e .
      - name: Check installed rakaia version
        run: rakaia -v
      - name: Run pytest for rakaia
        shell: bash -l {0}
        run: pytest --headless --cov=rakaia
